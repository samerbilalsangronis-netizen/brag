  </g>
  <ellipse class="brillo" cx="520" cy="580" rx="20" ry="6" fill="#fff" opacity=".85"/><ellipse class="brillo" cx="580" cy="596" rx="10" ry="4" fill="#fff" opacity=".85"/><ellipse class="brillo" cx="300" cy="560" rx="16" ry="5" fill="#fff" opacity=".85"/>
</svg>
