<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="halo" cx="50%" cy="56%" r="52%">
      <stop offset="0" stop-color="#e1b35c" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#e1b35c" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e1b35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#d48b45"/>
      <stop offset=".6" stop-color="#a65d26"/>
      <stop offset="1" stop-color="#6e3a14"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c879"/>
      <stop offset="1" stop-color="#b9822f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="t">
        <feFuncR type="linear" slope=".35" intercept=".72"/>
        <feFuncG type="linear" slope=".35" intercept=".72"/>
        <feFuncB type="linear" slope=".35" intercept=".72"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <style>
    .vapor path { fill: none; stroke: #f5ecdc; stroke-width: 20; stroke-linecap: round; opacity: .22; filter: blur(3px); }
    .vapor path { animation: subir 3.2s ease-in-out infinite; }
    .vapor path:nth-child(2) { animation-delay: -1.1s; }
    .vapor path:nth-child(3) { animation-delay: -2.2s; }
    .brillo { animation: brillar 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .brillo:nth-of-type(2n) { animation-delay: -1.2s; }
    @keyframes subir {
      0% { transform: translateY(20px); opacity: 0; }
      35% { opacity: .3; }
      100% { transform: translateY(-50px); opacity: 0; }
    }
    @keyframes brillar {
      0%, 100% { opacity: .35; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>
  <g id="fondo">
    <rect width="1080" height="1080" fill="#14201a"/>
    <rect width="1080" height="1080" fill="url(#halo)"/>
    <g transform="translate(120 120)" fill="none" stroke="url(#goldline)" stroke-width="6" opacity="0.1"><rect x="-60" y="-60" width="120" height="120" rx="6"/><rect x="-60" y="-60" width="120" height="120" rx="6" transform="rotate(45)"/></g><g transform="translate(960 140)" fill="none" stroke="url(#goldline)" stroke-width="6" opacity="0.08"><rect x="-44" y="-44" width="88" height="88" rx="6"/><rect x="-44" y="-44" width="88" height="88" rx="6" transform="rotate(45)"/></g><g transform="translate(110 960)" fill="none" stroke="url(#goldline)" stroke-width="6" opacity="0.08"><rect x="-44" y="-44" width="88" height="88" rx="6"/><rect x="-44" y="-44" width="88" height="88" rx="6" transform="rotate(45)"/></g><g transform="translate(970 950)" fill="none" stroke="url(#goldline)" stroke-width="6" opacity="0.1"><rect x="-60" y="-60" width="120" height="120" rx="6"/><rect x="-60" y="-60" width="120" height="120" rx="6" transform="rotate(45)"/></g>
    <path d="M150 1080 V430 a390 390 0 0 1 780 0 V1080" fill="none" stroke="#e1b35c" stroke-width="4" opacity=".16"/>
  </g><!--/fondo-->
  <ellipse id="sombra" cx="540" cy="860" rx="400" ry="46" fill="#000" opacity=".45" filter="url(#soft)"/>
  <g id="pan-lado" filter="url(#grain)">
    <path d="M150 640 L330 520 L340 700 Z" fill="#dcae6e"/><path d="M150 640 L330 520 L300 600 Z" fill="#b8803f" opacity=".45"/>
    <path d="M930 640 L750 520 L740 700 Z" fill="#dcae6e"/><path d="M930 640 L750 520 L790 610 Z" fill="#b8803f" opacity=".45"/>
  </g>
  <g id="bowl" filter="url(#grain)">
    <path d="M200 590 Q200 820 540 830 Q880 820 880 590 Z" fill="#c8553d"/>
    <path d="M225 680 Q540 760 855 680" stroke="#e1b35c" stroke-width="8" fill="none"/>
    <path d="M250 720 Q540 790 830 720" stroke="#e1b35c" stroke-width="4" fill="none" opacity=".7"/>
    <ellipse cx="540" cy="590" rx="340" ry="150" fill="#a8402c"/>
    <ellipse cx="540" cy="592" rx="306" ry="128" fill="#e8cf9e"/>
    <path d="M540 592 m-240 0 a240 96 0 1 0 480 0 a200 78 0 1 0 -400 0 a160 60 0 1 0 320 0 a110 40 0 1 0 -220 0" fill="none" stroke="#d2b07a" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="540" cy="590" rx="96" ry="38" fill="#e1b35c" opacity=".9"/>
    <ellipse cx="540" cy="588" rx="60" ry="20" fill="#f0c879" opacity=".8"/>
    <circle cx="470" cy="560" r="17" fill="#e9c97f"/><circle cx="465" cy="555" r="5" fill="#fff3d6"/><circle cx="610" cy="590" r="17" fill="#e9c97f"/><circle cx="605" cy="585" r="5" fill="#fff3d6"/><circle cx="560" cy="640" r="17" fill="#e9c97f"/><circle cx="555" cy="635" r="5" fill="#fff3d6"/><circle cx="420" cy="630" r="17" fill="#e9c97f"/><circle cx="415" cy="625" r="5" fill="#fff3d6"/><circle cx="660" cy="540" r="17" fill="#e9c97f"/><circle cx="655" cy="535" r="5" fill="#fff3d6"/><circle cx="500" cy="520" r="17" fill="#e9c97f"/><circle cx="495" cy="515" r="5" fill="#fff3d6"/><circle cx="632" cy="607" r="5" fill="#b5321c"/><circle cx="448" cy="576" r="3" fill="#b5321c"/><circle cx="422" cy="608" r="5" fill="#b5321c"/><circle cx="583" cy="537" r="5" fill="#b5321c"/><circle cx="419" cy="596" r="3" fill="#b5321c"/><circle cx="434" cy="637" r="5" fill="#b5321c"/><circle cx="654" cy="563" r="5" fill="#b5321c"/><circle cx="462" cy="526" r="5" fill="#b5321c"/><circle cx="409" cy="635" r="5" fill="#b5321c"/><circle cx="489" cy="547" r="5" fill="#b5321c"/><circle cx="623" cy="659" r="4" fill="#b5321c"/><circle cx="536" cy="652" r="4" fill="#b5321c"/><circle cx="608" cy="544" r="3" fill="#b5321c"/><circle cx="439" cy="646" r="5" fill="#b5321c"/><circle cx="550" cy="601" r="5" fill="#b5321c"/><circle cx="643" cy="638" r="5" fill="#b5321c"/><circle cx="491" cy="589" r="3" fill="#b5321c"/><circle cx="572" cy="645" r="4" fill="#b5321c"/><circle cx="651" cy="528" r="5" fill="#b5321c"/><circle cx="669" cy="566" r="4" fill="#b5321c"/><circle cx="514" cy="513" r="4" fill="#b5321c"/><circle cx="565" cy="566" r="4" fill="#b5321c"/><circle cx="407" cy="618" r="4" fill="#b5321c"/><circle cx="582" cy="586" r="5" fill="#b5321c"/><circle cx="603" cy="554" r="5" fill="#b5321c"/><circle cx="592" cy="539" r="3" fill="#b5321c"/><path d="M496 614 l9 -7 l3 10 Z" fill="#6f9a3e"/><path d="M572 552 l9 -7 l3 10 Z" fill="#6f9a3e"/><path d="M478 531 l9 -7 l3 10 Z" fill="#6f9a3e"/><path d="M423 555 l