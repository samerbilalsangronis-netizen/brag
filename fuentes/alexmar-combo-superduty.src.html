<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url(assets/Anton.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; src: url(assets/Montserrat.woff2) format("woff2"); font-weight: 100 900; }
      :root { --rojo: #d7262b; --tinta: #151515; --claro: #f1f0ec; --gris: #6b6b6b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--claro); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--claro); color: var(--tinta); font-family: "Montserrat", sans-serif; }
      .full { position: absolute; inset: 0; }
      .puntos { position: absolute; inset: 0; background-image: radial-gradient(rgba(21,21,21,.10) 2px, transparent 2px); background-size: 40px 40px; }
      .paso { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font: 800 30px/1 "Montserrat"; letter-spacing: .22em; color: var(--gris); text-transform: uppercase; }
      .paso b { color: var(--rojo); }
      .titulo { position: absolute; left: 0; right: 0; top: 210px; text-align: center; font: 400 120px/1 "Anton"; text-transform: uppercase; }
      .zona { position: absolute; border: 6px solid var(--rojo); background: rgba(215,38,43,.18); border-radius: 18px; }
      .anillo { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 6px solid var(--rojo); }
      .cursor { position: absolute; width: 90px; height: 90px; }
      .ficha { position: absolute; left: 60px; right: 60px; background: #fff; border-radius: 26px; box-shadow: 0 24px 60px rgba(0,0,0,.14); padding: 34px 40px 36px; }
      .ficha .nombre { font: 400 130px/0.95 "Anton"; color: var(--rojo); text-transform: uppercase; }
      .ficha .sub { font: 800 36px/1.2 "Montserrat"; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }
      .ficha img { display: block; margin: 0 auto 18px; }
      .fila { position: absolute; left: 60px; right: 60px; height: 300px; background: #fff; border-radius: 26px; box-shadow: 0 18px 40px rgba(0,0,0,.10); }
      .fila img { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); }
      .fila .txt { position: absolute; left: 470px; top: 70px; right: 140px; font: 400 66px/1 "Anton"; text-transform: uppercase; }
      .fila .txt small { display: block; font: 800 26px/1.3 "Montserrat"; letter-spacing: .06em; color: var(--gris); margin-top: 12px; }
      .check { position: absolute; right: 40px; top: 105px; width: 90px; height: 90px; border-radius: 18px; border: 6px solid var(--tinta); }
      .check i { position: absolute; inset: 0; background: var(--rojo); border-radius: 12px; }
      .check svg { position: absolute; inset: 10px; }
    </style>
  </head>
  <body>
    <!-- Gancho "Combo Super Duty" · Alexmar. Configurador de piezas: el cursor elige la pieza y aparece su nombre. 12 s, 9:16, sin voz. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="fondo" class="clip full" data-start="0" data-duration="12" data-track-index="0"><div class="puntos"></div></div>

      <!-- 1 · titulo -->
      <div id="s1" class="clip full" data-start="0" data-duration="1.7" data-track-index="1">
        <div id="h1" style="position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 400 260px/0.9 'Anton'; text-transform: uppercase">Combo</div>
        <div id="h2" style="position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 400 190px/0.9 'Anton'; color: var(--rojo); text-transform: uppercase">Super Duty</div>
        <div id="h3" style="position: absolute; left: 0; right: 0; top: 960px; text-align: center; font: 800 36px/1 'Montserrat'; letter-spacing: .2em; color: var(--gris)">@AUTOALEXMAR_CAR</div>
      </div>

      <!-- 2 · babero -->
      <div id="s2" class="clip full" data-start="1.4" data-duration="3.6" data-track-index="2">
        <div class="paso" id="p2">Selecciona la pieza · <b>1/2</b></div>
        <img id="truck1" src="assets/alexmar/sd-camioneta-babero.png" style="position: absolute; left: 40px; top: 300px; width: 1000px" alt="" />
        <div class="zona" id="z1" style="left: 115px; top: 916px; width: 850px; height: 98px"></div>
        <div class="anillo" id="r1" style="left: 540px; top: 965px"></div>
        <div class="ficha" id="k1" style="top: 1220px">
          <img src="assets/alexmar/sd-babero.png" style="width: 860px" alt="" />
          <div class="nombre">Babero</div>
          <div class="sub">de Super Duty</div>
        </div>
      </div>

      <!-- 3 · faros -->
      <div id="s3" class="clip full" data-start="4.5" data-duration="3.3" data-track-index="3">
        <div class="paso" id="p3">Selecciona la pieza · <b>2/2</b></div>
        <img id="truck2" src="assets/alexmar/sd-camioneta-faros.png" style="position: absolute; left: 20px; top: 380px; width: 1040px" alt="" />
        <div class="zona" id="z2" style="left: 422px; top: 560px; width: 124px; height: 92px"></div>
        <div class="anillo" id="r2" style="left: 484px; top: 606px"></div>
        <div class="ficha" id="k2" style="top: 1040px">
          <img src="assets/alexmar/sd-faros.png" style="width: 760px" alt="" />
          <div class="nombre">Faros</div>
          <div class="sub">Modelo 2010 · <span style="color: var(--rojo)">Pieza original</span></div>
        </div>
      </div>

      <!-- 4 · combo -->
      <div id="s4" class="clip full" data-start="7.5" data-duration="2.4" data-track-index="4">
        <div class="paso" id="p4">Tu combo</div>
        <div class="titulo" id="t4">Combo <span style="color: var(--rojo)">Super Duty</span></div>
        <div class="fila" id="f1" style="top: 520px">
          <img src="assets/alexmar/sd-babero.png" style="width: 410px" alt="" />
          <div class="txt">Babero<small>DE SUPER DUTY</small></div>
          <div class="check"><i id="c1"></i><svg viewBox="0 0 24 24"><path id="v1" d="M4 12.5l5 5L20 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="30" /></svg></div>
        </div>
        <div class="fila" id="f2" style="top: 860px">
          <img src="assets/alexmar/sd-faros.png" style="width: 410px" alt="" />
          <div class="txt">Faros<small>MODELO 2010 · PIEZA ORIGINAL</small></div>
          <div class="check"><i id="c2"></i><svg viewBox="0 0 24 24"><path id="v2" d="M4 12.5l5 5L20 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="30" /></svg></div>
        </div>
        <div id="listo" style="position: absolute; left: 60px; right: 60px; top: 1230px; height: 150px; border-radius: 26px; background: var(--tinta); color: #fff; text-align: center; font: 400 84px/150px 'Anton'; text-transform: uppercase">2 piezas · <span style="color: var(--rojo)">1 combo</span></div>
      </div>

      <!-- 5 · cierre -->
      <div id="s5" class="clip full" data-start="9.6" data-duration="2.4" data-track-index="5">
        <div class="full" id="cierre" style="background: var(--rojo); clip-path: inset(0 100% 0 0)">
          <img id="logo" src="assets/alexmar/logo-hd.png" style="position: absolute; left: 315px; top: 300px; width: 450px" alt="" />
          <div id="cn" style="position: absolute; left: 0; right: 0; top: 770px; text-align: center; font: 400 110px/0.95 'Anton'; color: #fff; text-transform: uppercase">Pregunta por<br />el combo</div>
          <div id="ct" style="position: absolute; left: 70px; right: 70px; top: 1030px; padding: 26px 0; text-align: center; background: #fff; color: var(--tinta); font: 400 130px/1 'Anton'; letter-spacing: .02em">0416 676 83 93</div>
          <div id="ci" style="position: absolute; left: 0; right: 0; top: 1260px; text-align: center; font: 800 48px/1 'Montserrat'; letter-spacing: .08em; color: #fff">@autoalexmar_car</div>
        </div>
      </div>

      <!-- cursor (encima de todo) -->
      <div id="capa-cursor" class="clip full" data-start="1.4" data-duration="6.2" data-track-index="6" style="pointer-events: none">
        <svg class="cursor" id="cur" viewBox="0 0 24 24" style="left: 0; top: 0"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z" fill="#151515" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" /></svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const SECO = { ease: "power4.out", duration: 0.3 };
      const MUELLE = { ease: "back.out(1.6)", duration: 0.45 };

      // 1 · titulo
      tl.fromTo("#h1", { opacity: 0, y: -160 }, { opacity: 1, y: 0, ...SECO }, 0.1);
      tl.fromTo("#h2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, ...SECO }, 0.45);
      tl.fromTo("#h3", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.8);
      tl.to(["#h1", "#h2", "#h3"], { opacity: 0, y: -80, duration: 0.25, ease: "power2.in" }, 1.4);

      // seleccion: zona que se marca + anillo de clic + ficha
      const seleccion = (z, r, k, tClic) => {
        tl.fromTo(r, { scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: "power2.out" }, tClic);
        tl.fromTo(z, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, tClic + 0.02);
        tl.to(z, { opacity: 0.55, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, tClic + 0.3);
        tl.fromTo(k, { opacity: 0, y: 140 }, { opacity: 1, y: 0, ...MUELLE }, tClic + 0.2);
      };

      // 2 · babero
      tl.fromTo("#truck1", { opacity: 0, y: 120 }, { opacity: 1, y: 0, ...SECO }, 1.45);
      tl.fromTo("#p2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.6);
      seleccion("#z1", "#r1", "#k1", 2.55);
      tl.to("#truck1", { opacity: 0.45, duration: 0.3 }, 2.75);
      tl.to(["#truck1", "#z1", "#k1", "#p2"], { x: -1100, duration: 0.45, ease: "power3.inOut" }, 4.5);

      // 3 · faros
      tl.fromTo("#truck2", { x: 1100 }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 4.5);
      tl.fromTo("#p3", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.7);
      seleccion("#z2", "#r2", "#k2", 5.75);
      tl.to("#truck2", { opacity: 0.45, duration: 0.3 }, 5.95);
      tl.to(["#truck2", "#z2", "#k2", "#p3"], { opacity: 0, duration: 0.25 }, 7.45);

      // cursor: viaja, hace clic (se encoge) y sigue
      tl.set("#cur", { x: 900, y: 1500 }, 0);
      tl.fromTo("#cur", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.75);
      tl.to("#cur", { x: 525, y: 958, duration: 0.65, ease: "power2.inOut" }, 1.85);
      tl.to("#cur", { scale: 0.75, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "10% 5%" }, 2.5);
      tl.to("#cur", { x: 900, y: 1700, duration: 0.6, ease: "power2.inOut" }, 3.0);
      tl.to("#cur", { x: 470, y: 600, duration: 0.75, ease: "power2.inOut" }, 4.95);
      tl.to("#cur", { scale: 0.75, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "10% 5%" }, 5.7);
      tl.to("#cur", { x: 960, y: 1800, duration: 0.6, ease: "power2.inOut" }, 6.2);
      tl.to("#cur", { opacity: 0, duration: 0.2 }, 6.7);

      // 4 · combo
      tl.fromTo("#p4", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.55);
      tl.fromTo("#t4", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, ...SECO }, 7.55);
      [["#f1", "#c1", "#v1", 7.75], ["#f2", "#c2", "#v2", 8.15]].forEach(([f, c, v, t]) => {
        tl.fromTo(f, { opacity: 0, x: -200 }, { opacity: 1, x: 0, ...SECO }, t);
        tl.fromTo(c, { scale: 0 }, { scale: 1, ...MUELLE }, t + 0.35);
        tl.fromTo(v, { attr: { "stroke-dashoffset": 30 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.25, ease: "power2.out" }, t + 0.45);
      });
      tl.fromTo("#listo", { opacity: 0, y: 60 }, { opacity: 1, y: 0, ...MUELLE }, 8.8);

      // 5 · cierre rojo con barrido horizontal
      tl.fromTo("#cierre", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.inOut" }, 9.6);
      tl.fromTo("#logo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ...MUELLE }, 9.9);
      tl.fromTo("#cn", { opacity: 0, y: 50 }, { opacity: 1, y: 0, ...SECO }, 10.05);
      tl.fromTo("#ct", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, ...SECO }, 10.2);
      tl.fromTo("#ci", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 10.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
