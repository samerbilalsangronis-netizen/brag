<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url(assets/Anton.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; src: url(assets/Montserrat.woff2) format("woff2"); font-weight: 100 900; }
      :root { --rojo: #d7262b; --carbon: #1c1d21; --carbon2: #26282d; --blanco: #ffffff; --gris: #a3a3a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--carbon); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--carbon); color: var(--blanco); font-family: "Montserrat", sans-serif; }
      .full { position: absolute; inset: 0; }
      .panel { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; }
      .cam img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .zona { position: absolute; border: 5px solid var(--rojo); background: rgba(215,38,43,.25); border-radius: 10px; opacity: 0; }
      .etiqueta { position: absolute; font: 800 28px/1 "Montserrat"; letter-spacing: .2em; color: var(--gris); text-transform: uppercase; }
      .anillo { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 6px solid var(--rojo); opacity: 0; }
      .ficha { position: absolute; left: 60px; right: 60px; background: #111214; border-radius: 26px; padding: 36px 40px 40px; border-top: 10px solid var(--rojo); }
      .ficha img { display: block; margin: 0 auto 22px; }
      .ficha .nombre { font: 400 140px/0.92 "Anton"; color: var(--blanco); text-transform: uppercase; }
      .ficha .sub { font: 800 38px/1.2 "Montserrat"; letter-spacing: .06em; color: var(--rojo); text-transform: uppercase; margin-top: 12px; }
      .cursor { position: absolute; left: 0; top: 0; width: 90px; height: 90px; }
    </style>
  </head>
  <body>
    <!-- Gancho "¿Cual es tu Super Duty?" · Alexmar. Pantalla dividida: se elige la camioneta, la camara entra hasta la pieza y aparece su nombre. Cada pieza con su camioneta. 12 s, 9:16, sin voz. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="escena" class="clip full" data-start="0" data-duration="12" data-track-index="0" style="z-index: 0">
        <!-- mitad B (abajo): la blanca, faros modelo 2010 -->
        <div class="panel" id="pB" style="background: var(--carbon2); clip-path: inset(50% 0 0 0); z-index: 1">
          <div class="cam" id="camB" style="left: 40px; top: 1180px; width: 1000px; height: 519px">
            <img src="assets/alexmar/sd-camioneta-faros.png" alt="" />
            <div class="zona" id="zB" style="left: 386px; top: 172px; width: 122px; height: 92px"></div>
          </div>
          <div class="etiqueta" id="eB" style="left: 60px; top: 1010px">Opción B</div>
        </div>
        <!-- mitad A (arriba): la plateada, babero -->
        <div class="panel" id="pA" style="background: var(--carbon); clip-path: inset(0 0 50% 0); z-index: 2">
          <div class="cam" id="camA" style="left: 160px; top: 160px; width: 760px; height: 664px">
            <img src="assets/alexmar/sd-camioneta-babero.png" alt="" />
            <div class="zona" id="zA" style="left: 56px; top: 466px; width: 648px; height: 80px"></div>
          </div>
          <div class="etiqueta" id="eA" style="left: 60px; top: 90px">Opción A</div>
        </div>
        <!-- franja central con la pregunta -->
        <div id="franja" style="position: absolute; left: 0; right: 0; top: 880px; height: 160px; background: var(--rojo); z-index: 5; text-align: center; font: 400 104px/160px 'Anton'; text-transform: uppercase">¿Cuál es tu Super Duty?</div>
        <div class="anillo" id="rA" style="left: 540px; top: 520px; z-index: 6"></div>
        <div class="anillo" id="rB" style="left: 540px; top: 1440px; z-index: 6"></div>
        <!-- fichas -->
        <div class="ficha" id="kA" style="top: 1150px; z-index: 7">
          <img src="assets/alexmar/sd-babero.png" style="width: 880px" alt="" />
          <div class="nombre">Babero</div>
          <div class="sub">de Super Duty</div>
        </div>
        <div class="ficha" id="kB" style="top: 1110px; z-index: 7">
          <img src="assets/alexmar/sd-faros.png" style="width: 760px" alt="" />
          <div class="nombre">Faros</div>
          <div class="sub">Modelo 2010 · Pieza original</div>
        </div>
        <svg class="cursor" id="cur" viewBox="0 0 24 24" style="z-index: 8"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round" /></svg>
      </div>

      <!-- cierre -->
      <div id="s-cierre" class="clip full" data-start="9.3" data-duration="2.7" data-track-index="1" style="z-index: 1">
        <div class="full" id="cierre" style="background: var(--rojo); clip-path: inset(100% 0 0 0)">
          <img id="logo" src="assets/alexmar/logo-hd.png" style="position: absolute; left: 315px; top: 260px; width: 450px" alt="" />
          <div id="cn" style="position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 400 116px/0.95 'Anton'; text-transform: uppercase">Repuestos para<br />tu Super Duty</div>
          <div id="ct" style="position: absolute; left: 70px; right: 70px; top: 1040px; padding: 26px 0; text-align: center; background: var(--carbon); color: #fff; font: 400 130px/1 'Anton'; letter-spacing: .02em">0416 676 83 93</div>
          <div id="ci" style="position: absolute; left: 0; right: 0; top: 1270px; text-align: center; font: 800 48px/1 'Montserrat'; letter-spacing: .08em">@autoalexmar_car</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const SECO = { ease: "power4.out", duration: 0.3 };
      const MUELLE = { ease: "back.out(1.5)", duration: 0.45 };
      const CAM = { ease: "power3.inOut", duration: 0.7 };

      // apertura: las dos mitades entran por lados opuestos y cae la pregunta
      tl.fromTo("#camA", { x: -1100 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#camB", { x: 1100 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(["#eA", "#eB"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
      tl.fromTo("#franja", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power4.out" }, 0.35);
      tl.to("#franja", { scaleY: 0, duration: 0.2, ease: "power2.in" }, 1.55);

      // cursor: elige A
      tl.set("#cur", { x: 900, y: 1700, opacity: 0 }, 0);
      tl.to("#cur", { opacity: 1, duration: 0.15 }, 1.45);
      tl.to("#cur", { x: 529, y: 512, duration: 0.6, ease: "power2.inOut" }, 1.5);
      tl.to("#cur", { scale: 0.75, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "12% 8%" }, 2.15);
      tl.fromTo("#rA", { scale: 0.3, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 2.2);
      tl.to("#cur", { opacity: 0, duration: 0.15 }, 2.35);

      // A ocupa toda la pantalla y la camara entra al parachoques
      tl.to("#pA", { clipPath: "inset(0 0 0% 0)", duration: 0.45, ease: "power3.inOut" }, 2.3);
      tl.to("#eA", { opacity: 0, duration: 0.15 }, 2.3);
      tl.to("#camA", { scale: 1.55, y: 60, transformOrigin: "380px 510px", ...CAM }, 2.55);
      tl.to("#zA", { opacity: 1, duration: 0.2 }, 3.2);
      tl.to("#zA", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.4);
      tl.fromTo("#kA", { opacity: 0, y: 160 }, { opacity: 1, y: 0, ...MUELLE }, 3.35);

      // vuelta a la pantalla dividida
      tl.to("#kA", { opacity: 0, y: 120, duration: 0.25, ease: "power2.in" }, 4.85);
      tl.to("#zA", { opacity: 0, duration: 0.15 }, 4.9);
      tl.to("#camA", { scale: 1, y: 0, ...CAM, duration: 0.55 }, 4.95);
      tl.to("#pA", { clipPath: "inset(0 0 50% 0)", duration: 0.45, ease: "power3.inOut" }, 5.05);
      tl.to("#eA", { opacity: 1, duration: 0.2 }, 5.4);
      tl.to("#franja", { scaleY: 1, duration: 0.25, ease: "power4.out" }, 5.35);
      tl.to("#franja", { scaleY: 0, duration: 0.2, ease: "power2.in" }, 6.25);

      // cursor: elige B
      tl.set("#cur", { x: 900, y: 1800 }, 5.4);
      tl.to("#cur", { opacity: 1, duration: 0.15 }, 5.45);
      tl.to("#cur", { x: 529, y: 1432, duration: 0.55, ease: "power2.inOut" }, 5.5);
      tl.to("#cur", { scale: 0.75, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "12% 8%" }, 6.1);
      tl.fromTo("#rB", { scale: 0.3, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 6.15);
      tl.to("#cur", { opacity: 0, duration: 0.15 }, 6.3);

      // B pasa al frente, ocupa la pantalla y la camara entra al faro
      tl.set("#pB", { zIndex: 3 }, 6.25);
      tl.to("#pB", { clipPath: "inset(0% 0 0 0)", duration: 0.45, ease: "power3.inOut" }, 6.25);
      tl.to("#eB", { opacity: 0, duration: 0.15 }, 6.25);
      tl.to("#camB", { scale: 3, x: 57, y: -698, transformOrigin: "443px 218px", ...CAM, duration: 0.8 }, 6.45);
      tl.to("#zB", { opacity: 1, duration: 0.2 }, 7.2);
      tl.to("#zB", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#kB", { opacity: 0, y: 160 }, { opacity: 1, y: 0, ...MUELLE }, 7.35);

      // cierre: el rojo sube desde abajo
      tl.to(["#kB", "#zB"], { opacity: 0, duration: 0.1 }, 9.7);
      tl.fromTo("#cierre", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.45, ease: "power3.inOut" }, 9.3);
      tl.fromTo("#logo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ...MUELLE }, 9.6);
      tl.fromTo("#cn", { opacity: 0, y: 50 }, { opacity: 1, y: 0, ...SECO }, 9.75);
      tl.fromTo("#ct", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, ...SECO }, 9.95);
      tl.fromTo("#ci", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 10.15);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
