<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Reem Kufi"; src: url(assets/ReemKufi.woff2) format("woff2"); font-weight: 400 700; }
      @font-face { font-family: "Montserrat"; src: url(assets/Montserrat.woff2) format("woff2"); font-weight: 100 900; }
      :root { --fondo: #131e18; --panel: #1c2b23; --oro: #d4a24c; --crema: #f3ead6; --gris: #9fb0a5; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; color: var(--crema); font-family: "Montserrat", sans-serif;
        background: radial-gradient(ellipse 110% 70% at 50% 40%, #1e3127 0%, #131e18 65%, #0d1511 100%); }
      .full { position: absolute; inset: 0; }
      /* telefono: marco fijo, la grabacion va dentro (sin tiempo en el envoltorio) */
      #tel { position: absolute; left: 220px; top: 330px; width: 640px; height: 1385px; border-radius: 70px; background: #0a100d;
        box-shadow: 0 0 0 3px rgba(212,162,76,.55), 0 40px 90px rgba(0,0,0,.55); }
      #pantalla { position: absolute; left: 14px; top: 14px; width: 612px; height: 1357px; border-radius: 58px; overflow: hidden; background: #131e18; }
      #pantalla video { position: absolute; left: 0; top: 0; width: 612px; height: 1357px; object-fit: cover; }
      .paso { position: absolute; left: 70px; right: 70px; top: 96px; height: 200px; display: flex; align-items: center; gap: 30px; opacity: 0; }
      .num { flex: none; width: 128px; height: 128px; border-radius: 50%; background: var(--oro); color: var(--fondo); text-align: center; font: 700 70px/128px "Reem Kufi"; }
      .txt b { display: block; font: 700 66px/1 "Reem Kufi"; color: var(--crema); }
      .txt span { display: block; font: 600 32px/1.25 "Montserrat"; color: var(--oro); margin-top: 14px; }
      #puntos { position: absolute; left: 0; right: 0; top: 1770px; text-align: center; }
      #puntos i { display: inline-block; width: 18px; height: 18px; border-radius: 9px; margin: 0 9px; background: rgba(243,234,214,.22); }
      #gancho-t { position: absolute; left: 60px; right: 60px; top: 760px; text-align: center; font: 700 120px/1 "Reem Kufi"; }
      #gancho-s { position: absolute; left: 60px; right: 60px; top: 920px; text-align: center; font: 600 44px/1.3 "Montserrat"; color: var(--oro); }
      #logo-g { position: absolute; left: 390px; top: 360px; width: 300px; }
      #cierre { position: absolute; inset: 0; background: radial-gradient(ellipse 110% 70% at 50% 40%, #1e3127 0%, #131e18 65%, #0d1511 100%); }
      #c-logo { position: absolute; left: 315px; top: 330px; width: 450px; }
      #c-t { position: absolute; left: 60px; right: 60px; top: 860px; text-align: center; font: 700 96px/1.05 "Reem Kufi"; }
      #c-t em { font-style: normal; color: var(--oro); }
      #c-web { position: absolute; left: 110px; right: 110px; top: 1110px; padding: 30px 0; border-radius: 60px; background: var(--oro); color: var(--fondo); text-align: center; font: 800 46px/1 "Montserrat"; }
      #c-dias { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; font: 700 58px/1.2 "Reem Kufi"; }
      #c-hora { position: absolute; left: 0; right: 0; top: 1370px; text-align: center; font: 600 44px/1.2 "Montserrat"; color: var(--oro); }
    </style>
  </head>
  <body>
    <!-- Habibis · tutorial "como pedir en la web". Grabacion real de un pedido de PRUEBA (habibis-chi.vercel.app). Sin voz ni musica. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="49.77" data-width="1080" data-height="1920">
      <div id="tel"><div id="pantalla">
        <video id="grab" class="clip" src="assets/grabacion.mp4" muted playsinline data-start="3.0" data-duration="41.77" data-track-index="0"></video>
      </div></div>

      <div id="capa" class="clip full" data-start="0" data-duration="49.77" data-track-index="1">
        <img id="logo-g" src="assets/logo-habibis.png" alt="" />
        <div id="gancho-t">¿Antojo árabe?</div>
        <div id="gancho-s">Así pides en Habibis<br />desde tu teléfono</div>
        <div id="pasos"></div>
        <div id="puntos"></div>
      </div>

      <div id="s-cierre" class="clip full" data-start="44.32" data-duration="5" data-track-index="2">
        <div id="cierre">
          <img id="c-logo" src="assets/logo-habibis.png" alt="" />
          <div id="c-t">¡Haz tu pedido <em>ahora!</em></div>
          <div id="c-web">habibis-chi.vercel.app</div>
          <div id="c-dias">Miércoles a domingo</div>
          <div id="c-hora">5:00 p. m. – 11:00 p. m.</div>
        </div>
      </div>
    </div>
    <script>
      const PASOS = [{"n": 1, "tit": "Entra a la web", "det": "Mira el menú y los favoritos", "t0": 3.4, "t1": 6.35}, {"n": 2, "tit": "Elige tu plato", "det": "Toca la categoría y el plato", "t0": 6.35, "t1": 10.01}, {"n": 3, "tit": "Personaliza y agrega", "det": "Adicionales, cantidad y «Agregar»", "t0": 10.01, "t1": 14.4}, {"n": 4, "tit": "Revisa tu pedido", "det": "Toca «Ver pedido» y «Continuar»", "t0": 14.4, "t1": 17.06}, {"n": 5, "tit": "Tus datos", "det": "Nombre y WhatsApp", "t0": 17.06, "t1": 21.2}, {"n": 6, "tit": "Delivery o retiro", "det": "Dirección y ubicación en el mapa", "t0": 21.2, "t1": 29.48}, {"n": 7, "tit": "Hora y forma de pago", "det": "Binance, bolívares o efectivo", "t0": 29.48, "t1": 37.32}, {"n": 8, "tit": "Confirma", "det": "Toca «Confirmar pedido»", "t0": 37.32, "t1": 39.5}, {"n": 9, "tit": "¡Pedido recibido!", "det": "Síguelo en vivo o envía copia por WhatsApp", "t0": 39.5, "t1": 44.77}];
      const T_GRAB = 3.0, FIN = 44.32;
      const tl = gsap.timeline({ paused: true });
      const GOLPE = { ease: "power4.out", duration: 0.3 };
      const MUELLE = { ease: "back.out(1.6)", duration: 0.5 };

      // gancho: logo, pregunta y el telefono que sube con la web
      tl.fromTo("#logo-g", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ...MUELLE }, 0.1);
      tl.fromTo("#gancho-t", { opacity: 0, y: 60 }, { opacity: 1, y: 0, ...GOLPE }, 0.45);
      tl.fromTo("#gancho-s", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.85);
      tl.fromTo("#tel", { y: 1700 }, { y: 0, duration: 0.7, ease: "power3.out" }, T_GRAB - 0.75);
      tl.to(["#logo-g", "#gancho-t", "#gancho-s"], { opacity: 0, y: -80, duration: 0.3, ease: "power2.in" }, T_GRAB - 0.75);

      // pasos: numero + titulo arriba del telefono, un punto de progreso por paso
      const cont = document.getElementById("pasos"), puntos = document.getElementById("puntos");
      PASOS.forEach((p, i) => {
        const el = document.createElement("div");
        el.className = "paso"; el.id = "p" + i;
        el.innerHTML = `<div class="num">${p.n}</div><div class="txt"><b>${p.tit}</b><span>${p.det}</span></div>`;
        cont.appendChild(el);
        const pt = document.createElement("i"); pt.id = "pt" + i; puntos.appendChild(pt);
        tl.fromTo("#p" + i, { opacity: 0, x: -80 }, { opacity: 1, x: 0, ...GOLPE }, p.t0);
        tl.fromTo("#p" + i + " .num", { scale: 0.4 }, { scale: 1, ...MUELLE }, p.t0);
        if (i < PASOS.length - 1) tl.to("#p" + i, { opacity: 0, x: 60, duration: 0.2, ease: "power2.in" }, p.t1 - 0.2);
        tl.fromTo("#pt" + i, { backgroundColor: "rgba(243,234,214,.22)", scale: 1 }, { backgroundColor: "#d4a24c", scale: 1.35, duration: 0.25, immediateRender: false }, p.t0);
      });
      tl.fromTo("#puntos", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T_GRAB);
      // leve acercamiento del telefono durante el pedido, para que nunca este quieto
      tl.fromTo("#tel", { scale: 1 }, { scale: 1.03, duration: FIN - T_GRAB, ease: "none", transformOrigin: "50% 0%", immediateRender: false }, T_GRAB);

      // cierre
      tl.fromTo("#cierre", { clipPath: "circle(0px at 540px 1000px)" }, { clipPath: "circle(1400px at 540px 1000px)", duration: 0.5, ease: "power3.in" }, FIN);
      tl.fromTo("#c-logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ...MUELLE }, FIN + 0.35);
      tl.fromTo("#c-t", { opacity: 0, y: 50 }, { opacity: 1, y: 0, ...GOLPE }, FIN + 0.6);
      tl.fromTo("#c-web", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ...MUELLE }, FIN + 0.85);
      tl.fromTo("#c-dias", { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...GOLPE }, FIN + 1.15);
      tl.fromTo("#c-hora", { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...GOLPE }, FIN + 1.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
