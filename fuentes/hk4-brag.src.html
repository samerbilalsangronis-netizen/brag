<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--css:hikman2-->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0d0f; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; color: var(--hueso); }
      .full { position: absolute; inset: 0; }
      .ficha { position: absolute; width: 220px; height: 150px; border: 4px solid var(--gris); text-align: center; font: 800 84px/142px "Barlow"; color: var(--hueso); background: rgba(12,13,15,.6); }
      .agenda { position: absolute; top: 960px; font: 800 52px/1 "Barlow"; color: var(--gris); }
      .golpe { position: absolute; left: 0; right: 0; top: 560px; text-align: center; opacity: 0; }
      .golpe .big { font: 800 300px/0.95 "Barlow"; letter-spacing: -0.01em; }
      .golpe .big.mono { font: 800 230px/1 "Mono"; letter-spacing: -0.03em; }
      .golpe .lab { font: 700 34px/1.2 "Mono"; letter-spacing: .16em; color: var(--gris); text-transform: uppercase; margin-top: 26px; }
    </style>
  </head>
  <body>
    <!-- Informe semanal 22.10 · Brag: gancho (0-10,8) y apertura (10,8-15,2). El cierre es hk4-cierre. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.2" data-width="1080" data-height="1920">
      <div id="fondo" class="clip full" data-start="0" data-duration="15.2" data-track-index="0">
        <div class="k-fondo"></div><div class="k-reticula"></div>
        <div id="barra"></div>
        <div id="balanza"></div>
      </div>

      <div id="s1" class="clip full" data-start="0" data-duration="15.2" data-track-index="1">
        <!-- Gancho: cifras gigantes, una por golpe de voz -->
        <div class="golpe" id="p1"><div class="big" style="color: var(--oso)">USD ▼</div><div class="lab">El dólar pierde piso</div></div>
        <div class="golpe" id="p2"><div class="big mono" style="color: var(--oso)">7,40%</div><div class="lab">Hipoteca a 30 años · la vivienda frena</div></div>
        <div class="golpe" id="p3"><div class="big" style="color: var(--toro); font-size: 230px">→ BONOS</div><div class="lab">El dinero corre al refugio</div></div>
        <div class="golpe" id="p4"><div class="big mono" style="color: var(--oso)">157 pb</div><div class="lab">Francia asusta a Europa</div></div>
        <div class="golpe" id="p5" style="top: 420px"><div class="big mono" style="color: var(--toro); font-size: 210px">−3,1 M</div><div class="lab">Barriles · inventarios</div><div class="big" id="p5b" style="color: var(--oso); font-size: 210px; margin-top: 40px">¿PAZ?</div><div class="lab" id="p5l">Medio Oriente</div></div>
        <div class="full" id="barrido" style="background: var(--hueso); opacity: 0"></div>
        <div class="k-frase" id="a-f1" style="font-size: 104px">Buenos días, <em style="color: var(--toro)">inversor</em></div>
        <div id="a-tit" style="position: absolute; left: 0; right: 0; top: 860px; text-align: center; font: 600 30px/1 'Mono'; letter-spacing: .24em; color: var(--gris)">ESTA SEMANA · DIVISA POR DIVISA</div>
        <div class="agenda" id="a1" style="left: 92px">USD</div><div class="agenda" id="a2" style="left: 232px">EUR</div><div class="agenda" id="a3" style="left: 372px">GBP</div>
        <div class="agenda" id="a4" style="left: 512px">AUD·NZD</div><div class="agenda" id="a5" style="left: 744px">JPY</div><div class="agenda" id="a6" style="left: 880px">WTI</div>
        <div id="vela-c"></div>
      </div>
    </div>
    <!--js:helpers-->
    <!--js:hikman2-->
    <script>
      window.SEMANA = { publicacion: "Informe semanal", fecha: "22.10.2026", temas: [],
        balanza: [[0,0],[1.5,0.45],[5.4,0.6],[8.4,0.2],[18.5,0.35]] };
      const tl = gsap.timeline({ paused: true });
      K.barra(document.getElementById("barra"));
      K.balanza(document.getElementById("balanza"));
      K.moverBalanza(tl, "#balanza .k-marca", 0, 15.2);
      document.getElementById("vela-c").outerHTML = K.velaHTML("vc", "oso");
      const frase = (id, tIn, tOut) => {
        spring(tl, id, { opacity: 0, y: 50 }, { opacity: 1, y: 0 }, tIn, ESTANDAR);
        if (tOut != null) tl.to(id, { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, tOut);
      };

      // Golpes: cada cifra entra seca con su palabra y sale cortada por la siguiente
      const golpes = [["#p1", 0.35, 2.35], ["#p2", 2.45, 3.95], ["#p3", 4.05, 5.35], ["#p4", 5.45, 7.85], ["#p5", 7.95, 10.6]];
      golpes.forEach(([id, t0, t1]) => {
        spring(tl, id, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1 }, t0, { ease: "power4.out", duration: 0.25 });
        tl.to(id, { opacity: 0, scale: 0.92, duration: 0.08, ease: "power2.in" }, t1);
        // destello corto en cada corte
        tl.fromTo("#barrido", { opacity: 0 }, { opacity: 0.18, duration: 0.03, ease: "none", immediateRender: false }, t0 - 0.02);
        tl.to("#barrido", { opacity: 0, duration: 0.14, ease: "power2.out" }, t0 + 0.01);
      });
      tl.fromTo("#barrido", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      // "¿PAZ?" llega cuando la voz la dice
      tl.fromTo("#p5b", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 9.95);
      tl.fromTo("#p5l", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 10.1);

      // Apertura
      frase("#a-f1", 10.85, null);
      spring(tl, "#a-tit", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, 12.6, SECO);
      for (let i = 1; i <= 6; i++) spring(tl, "#a" + i, { opacity: 0, y: 40 }, { opacity: 1, y: 0 }, 12.9 + i * 0.16, SECO);
      K.vela(tl, "vc", 15.2, null);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
