<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--css:hikman2-->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0d0f; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; color: var(--hueso); }
      .full { position: absolute; inset: 0; }
      .fila-v { position: absolute; left: 70px; right: 70px; height: 116px; border-bottom: 2px solid var(--linea); }
      .fila-v b { position: absolute; left: 0; top: 24px; font: 800 72px/1 "Barlow"; }
      .fila-v span { position: absolute; right: 0; top: 28px; padding: 12px 22px; font: 800 34px/1 "Mono"; letter-spacing: .06em; text-transform: uppercase; }
      .toro { background: var(--toro); color: #0c0d0f; } .oso { background: var(--oso); color: #0c0d0f; } .neutro { border: 3px solid var(--gris); color: var(--hueso); }
    </style>
  </head>
  <body>
    <!-- Informe semanal 22.10 · Brag: cierre y anuncio de la proxima publicacion. Tramo global 165,1 - 176,6. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.5" data-width="1080" data-height="1920">
      <div id="fondo" class="clip full" data-start="0" data-duration="11.5" data-track-index="0">
        <div class="k-fondo"></div><div class="k-reticula"></div>
        <div id="barra"></div>
        <div id="balanza"></div>
      </div>
      <div id="s1" class="clip full" data-start="0" data-duration="11.5" data-track-index="1">
        <div id="c-tit" style="position: absolute; left: 60px; right: 60px; top: 420px; text-align: center; font: 800 96px/0.95 'Barlow'; text-transform: uppercase">Ese es el resumen<br />de la semana</div>
        <img id="c-logo" src="assets/hikman/logo-blanco.png" style="position: absolute; left: 230px; top: 720px; width: 620px" alt="" />
        <div id="c-nota" style="position: absolute; left: 0; right: 0; top: 1410px; text-align: center; font: 600 22px/1 'Mono'; letter-spacing: .14em; color: var(--gris)">CONTENIDO EDUCATIVO · NO ES ASESORÍA FINANCIERA</div>
        <div id="pmi" style="position: absolute; left: 70px; right: 70px; top: 1180px; height: 190px; border: 4px solid var(--hueso); display: flex; align-items: center; gap: 30px; padding: 0 36px">
          <div style="font: 800 84px/1 'Mono'; color: var(--toro)">▶</div>
          <div><div style="font: 700 24px/1 'Mono'; letter-spacing: .16em; color: var(--gris)">PRÓXIMA PUBLICACIÓN</div><div style="font: 800 70px/1 'Barlow'; text-transform: uppercase; margin-top: 10px">Resumen de los <span style="color: var(--toro)">PMI</span></div></div>
        </div>
        <div id="vela-d"></div>
      </div>
    </div>
    <!--js:helpers-->
    <!--js:hikman2-->
    <script>
      window.SEMANA = { publicacion: "Informe semanal", fecha: "22.10.2026", temas: [],
        balanza: [[0,0],[155.9,0.1],[166.9,0.2]] };
      const tl = gsap.timeline({ paused: true });
      const T0 = 165.1, G = (t) => t - T0;
      K.barra(document.getElementById("barra"));
      K.balanza(document.getElementById("balanza"));
      K.moverBalanza(tl, "#balanza .k-marca", T0, 11.5);
      document.getElementById("vela-d").outerHTML = K.velaHTML("vd", "oso");
      K.vela(tl, "vd", null, 0);

      spring(tl, "#c-tit", { opacity: 0, y: 60 }, { opacity: 1, y: 0 }, G(165.5), ESTANDAR);
      spring(tl, "#c-logo", { opacity: 0, scale: 0.75, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1 }, G(167.4), PESADO);
      spring(tl, "#c-nota", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, G(167.9), SECO);
      spring(tl, "#pmi", { opacity: 0, y: 80 }, { opacity: 1, y: 0 }, G(169.3), ESTANDAR);
      tl.fromTo("#pmi", { borderColor: "#f2efe9" }, { borderColor: "#2fbf71", duration: 0.25, yoyo: true, repeat: 3, immediateRender: false }, G(172.0));
      // ocultos hasta su momento
      tl.fromTo(["#c-tit", "#c-logo", "#c-nota", "#pmi"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
