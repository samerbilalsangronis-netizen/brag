    <script>
// Resortes fisicos para GSAP: cada ease es la respuesta de un resorte amortiguado,
// y su duracion es el tiempo real en que se asienta. Deterministas (solo dependen de t).
function resorte({ rigidez = 170, amortiguacion = 22, masa = 1 } = {}) {
  const w0 = Math.sqrt(rigidez / masa);
  const z = amortiguacion / (2 * Math.sqrt(rigidez * masa));
  const T = z < 1 ? Math.log(1000) / (z * w0) : Math.log(1000) / (w0 * (z - Math.sqrt(z * z - 1)));
  const f = (s) => {
    if (z < 1) {
      const wd = w0 * Math.sqrt(1 - z * z);
      return 1 - Math.exp(-z * w0 * s) * (Math.cos(wd * s) + ((z * w0) / wd) * Math.sin(wd * s));
    }
    return 1 - Math.exp(-w0 * s) * (1 + w0 * s);
  };
  const ease = (t) => (t >= 1 ? 1 : f(t * T));
  return { ease, duration: T };
}
const SECO = resorte({ rigidez: 520, amortiguacion: 34 });
const ESTANDAR = resorte({ rigidez: 190, amortiguacion: 18 });
const PESADO = resorte({ rigidez: 110, amortiguacion: 16, masa: 1.6 });

// Tween con resorte: tl.fromTo con la duracion fisica del resorte.
function spring(tl, target, from, to, at, r = ESTANDAR) {
  return tl.fromTo(target, from, Object.assign({ ease: r.ease, duration: r.duration }, to), at);
}

// Vapor: cada voluta sube y se desvanece en ciclos finitos entre [desde, hasta].
function vapor(tl, prefix, desde, hasta, ciclo = 1.6) {
  const paths = document.querySelectorAll(".vapor-" + prefix + " path");
  paths.forEach((p, i) => {
    const n = Math.max(1, Math.floor((hasta - desde) / ciclo));
    for (let k = 0; k < n; k++) {
      const t0 = desde + k * ciclo + (i * ciclo) / paths.length;
      if (t0 + ciclo > hasta) break;
      tl.fromTo(p, { y: 20, opacity: 0 }, { y: -10, opacity: 0.32, duration: ciclo * 0.4, ease: "sine.out", immediateRender: false }, t0);
      tl.fromTo(p, { y: -10, opacity: 0.32 }, { y: -60, opacity: 0, duration: ciclo * 0.6, ease: "sine.in", immediateRender: false }, t0 + ciclo * 0.4);
    }
  });
}

// Brillos de salsa: titilan de forma ciclica entre [desde, hasta].
function brillos(tl, prefix, desde, hasta, ciclo = 1.2) {
  const els = document.querySelectorAll(".brillo-" + prefix);
  els.forEach((e, i) => {
    const n = Math.max(1, Math.floor((hasta - desde) / ciclo));
    for (let k = 0; k < n; k++) {
      const t0 = desde + k * ciclo + i * 0.37;
      if (t0 + ciclo > hasta) break;
      tl.fromTo(e, { opacity: 0.3, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.15, duration: ciclo / 2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, t0);
    }
  });
}

// Formatos de precio identicos a habibis-chi.vercel.app
const TASA = { cop: 3188, bs: 1014 }; // 1 USDT = 3.188 COP = Bs. 1.014
function fmtCOP(v) {
  return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " COP";
}
function fmtUSDT(cop) {
  return (cop / TASA.cop).toFixed(2).replace(".", ",") + " USDT";
}
function fmtBs(cop) {
  const n = (cop * TASA.bs) / TASA.cop;
  const [e, d] = n.toFixed(2).split(".");
  return "Bs. " + e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + d;
}

        for (let k = 0; k < n; k++) {
          const p = pts[k], q = pts[(k + 1) % n];
          d += " Q" + p[0].toFixed(0) + " " + p[1].toFixed(0) + " " + ((p[0] + q[0]) / 2).toFixed(0) + " " + ((p[1] + q[1]) / 2).toFixed(0);
        }
        return d + "Z";
      };
      const llenar = (svgId, colores, n, cls) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("id", svgId + "G");
        document.getElementById(svgId).appendChild(g);
        for (let i = 0; i < n; i++) {
          const x = (i % 4) * 360 - 60 + rnd() * 120, y = Math.floor(i / 4) * 560 + rnd() * 200, r = 430 + rnd() * 160;
          const b = document.createElementNS(NS, "g");
          b.setAttribute("class", cls);
          let h = '<path d="' + mancha(x, y, r) + '" fill="' + colores[i % colores.length] + '"/>';
          for (let k = 0; k < 4; k++) {
            const a = rnd() * Math.PI * 2, dd = r * (1.15 + rnd() * 0.35);
            h += '<circle cx="' + (x + Math.cos(a) * dd).toFixed(0) + '" cy="' + (y + Math.sin(a) * dd).toFixed(0) + '" r="' + (18 + rnd() * 40).toFixed(0) + '" fill="' + colores[i % colores.length] + '"/>';
          }
          b.innerHTML = h;
          g.appendChild(b);
        }
        return Array.from(document.querySelectorAll("." + cls));
      };
      // Estallido de fruta (fresa, guayaba, mango) y capa final de fresa bajo la pregunta
      const est = llenar("estallido", ["#d6263f", "#ee6e68", "#f2a20c", "#d6263f"], 14, "est");
      const fondoFresa = document.createElementNS(NS, "rect");
      Object.entries({ x: -600, y: -600, width: 2280, height: 3120, fill: "#d6263f", id: "fresaFondo" }).forEach(([k, v]) => fondoFresa.setAttribute(k, v));
      document.getElementById("estallido").appendChild(fondoFresa);
      // Gotas que vuelan hacia la pregunta
      const gotas = document.getElementById("gotas");
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        const s = 16 + rnd() * 30;
        Object.assign(d.style, { position: "absolute", width: s + "px", height: s + "px", borderRadius: "50%", background: ["#f2a20c", "#ffc94a", "#fff6e3"][i % 3], left: 90 + rnd() * 860 + "px", top: 700 + rnd() * 340 + "px", opacity: 0 });
        d.className = "gotita";
        gotas.appendChild(d);
      }
      // Cubierta de mango para pasar a la historia (mismos colores con que arranca la historia)
      const cub = llenar("cubre", ["#f2a20c", "#ffc94a", "#e8740a"], 14, "cub");
      // Abanico con los 12 empaques reales
      const sabores = ["mango", "parchita", "lulo", "pina", "durazno-melocoton", "guayaba", "tomate-de-arbol", "fresa", "mora", "tamarindo", "guanabana", "guanabana-con-fresa"];
      const abanico = document.getElementById("abanico");
      sabores.forEach((s, i) => {
        const d = document.createElement("div");
        d.className = "bolsa";
        d.innerHTML = '<img src="assets/empaques/' + s + '.png" alt="" />';
        abanico.appendChild(d);
      });

      // ===== 1 · Gancho (0 - 2,11)
      tl.fromTo("#estallidoG", { scale: 0.04, svgOrigin: "540 960" }, { scale: 1, duration: 0.42, ease: "expo.out" }, 0);
      est.forEach((b, i) => spring(tl, b, { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1.05 }, i * 0.01, ESTANDAR));
      tl.fromTo("#fresaFondo", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.25);
      [["#w1", 0.05], ["#w2", 0.3], ["#w3", 0.53], ["#w4", 0.78]].forEach(([w, t]) =>
        spring(tl, w, { opacity: 0, scale: 0.2, y: 60, filter: "blur(18px)", transformOrigin: "30% 70%" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)" }, t, ESTANDAR));
      document.querySelectorAll(".gotita").forEach((g, i) => {
        tl.fromTo(g, { opacity: 0, x: (i % 2 ? 1 : -1) * (220 + i * 14), y: (i % 3 - 1) * 260, scale: 1.6 }, { opacity: 1, x: 0, y: 0, scale: 0.4, duration: 0.5, ease: "power3.out" }, 0.05 + i * 0.03);
        tl.to(g, { opacity: 0, duration: 0.2 }, 0.5 + i * 0.03);
      });
      [["#fh1", 0.12, 1], ["#fh2", 0.3, -1], ["#fh3", 0.45, 1]].forEach(([f, t, l]) => {
        tl.fromTo(f, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        spring(tl, f, { scale: 0.2, rotation: -40 * l, x: 200 * l, y: 120 }, { scale: 1, rotation: 0, x: 0, y: 0, immediateRender: false }, t, ESTANDAR);
        tl.fromTo(f, { y: 0 }, { y: -26, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, t + 0.5);
      });
      // salida a mango
      cub.forEach((b, i) => spring(tl, b, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1.05 }, 1.72 + i * 0.012, ESTANDAR));
      tl.fromTo("#pregunta, .fh", { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, 1.86);
      tl.fromTo("#estallido", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, 2.1);

      // ===== 7 · Cierre (2,11 - 7,39): arranca cubierto por el verde que deja el catalogo
      tl.fromTo("#cubre", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, 2.11);
      const abiertos = document.querySelectorAll(".bolsa");
      abiertos.forEach((b, i) => {
        const ang = -42 + (84 / (abiertos.length - 1)) * i;
        tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, 2.11 + i * 0.025);
        spring(tl, b, { rotation: 0, y: 420, transformOrigin: "50% 860px" }, { rotation: ang, y: 0, immediateRender: false }, 2.11 + i * 0.025, ESTANDAR);
      });
      tl.fromTo("#abanico", { y: 0 }, { y: -18, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.6);
      spring(tl, "#logo", { opacity: 0, y: -80, scale: 0.85, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, scale: 1, immediateRender: false }, 3.18, PESADO);
      spring(tl, "#lema1", { opacity: 0, x: -80 }, { opacity: 1, x: 0, immediateRender: false }, 3.72, PESADO);
      spring(tl, "#lema2", { opacity: 0, x: -80 }, { opacity: 1, x: 0, immediateRender: false }, 3.9, PESADO);
      spring(tl, "#contacto", { opacity: 0, y: 40 }, { opacity: 1, y: 0, immediateRender: false }, 4.76, ESTANDAR);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
