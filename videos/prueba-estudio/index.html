<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #15110e;
        --fg: #f4ece3;
        --muted: #b3a597;
        --accent: #ff6b35;
        --track: #2c241e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Mono", monospace;
      }
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background layer */
      .glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        left: -300px;
        top: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 53, 0.24) 0%, rgba(255, 107, 53, 0) 62%);
      }
      .ghost {
        position: absolute;
        left: 0;
        bottom: -90px;
        font-family: "Archivo Black", sans-serif;
        font-size: 420px;
        line-height: 1;
        color: var(--fg);
        opacity: 0.06;
        white-space: nowrap;
        letter-spacing: -0.04em;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(244, 236, 227, 0.05) 2px, transparent 2px),
          linear-gradient(90deg, rgba(244, 236, 227, 0.05) 2px, transparent 2px);
        background-size: 120px 120px;
      }

      /* Layout */
      .frame {
        position: absolute;
        inset: 0;
        padding: 90px 120px;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .topbar b {
        color: var(--accent);
        font-weight: 500;
      }
      .rule {
        width: 100%;
        height: 3px;
        margin-top: 24px;
        background: var(--fg);
        opacity: 0.35;
        transform-origin: left center;
      }
      .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 100px;
      }
      .left {
        width: 860px;
      }
      .headline {
        font-family: "Archivo Black", sans-serif;
        font-size: 170px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      .word {
        display: block;
      }
      .word.accent {
        color: var(--accent);
      }
      .sub {
        margin-top: 40px;
        font-size: 32px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 760px;
      }

      /* Checklist panel */
      .panel {
        width: 720px;
        border: 3px solid rgba(244, 236, 227, 0.22);
        background: rgba(21, 17, 14, 0.75);
        padding: 56px 60px;
        display: flex;
        flex-direction: column;
        gap: 48px;
      }
      .panel-title {
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 36px;
      }
      .ok {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.1em;
      }
      .track {
        width: 100%;
        height: 14px;
        background: var(--track);
        overflow: hidden;
      }
      .fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: left center;
      }

      .bottombar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 24px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .tc {
        font-size: 44px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      /* Closing stamp */
      .stamp {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stamp-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 70px 110px;
        background: var(--bg);
        border: 4px solid var(--accent);
      }
      .stamp-text {
        font-family: "Archivo Black", sans-serif;
        font-size: 140px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--fg);
        white-space: nowrap;
      }
      .stamp-sub {
        font-size: 30px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .veil {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div class="grid"></div>
        <div class="glow" id="glow" data-layout-allow-overflow></div>
        <div class="ghost" id="ghost" data-layout-allow-overflow>MOTION STUDIO</div>

        <div class="frame">
          <div>
            <div class="topbar" id="topbar">
              <span><b>Brag</b> · Estudio de motion</span>
              <span>Prueba 001 · 1920×1080</span>
            </div>
            <div class="rule" id="rule"></div>
          </div>

          <div class="main" id="mainContent">
            <div class="left">
              <h1 class="headline">
                <span class="word" id="w1">Estudio</span>
                <span class="word accent" id="w2">listo.</span>
              </h1>
              <p class="sub" id="sub">Video de prueba de 15 segundos hecho con Hyperframes.</p>
            </div>

            <div class="panel" id="panel">
              <div class="panel-title">Revisión del sistema</div>
              <div class="row" id="r1">
                <div class="row-head"><span>Node.js 22</span><span class="ok" id="ok1">OK</span></div>
                <div class="track"><div class="fill" id="f1"></div></div>
              </div>
              <div class="row" id="r2">
                <div class="row-head"><span>FFmpeg 6.1</span><span class="ok" id="ok2">OK</span></div>
                <div class="track"><div class="fill" id="f2"></div></div>
              </div>
              <div class="row" id="r3">
                <div class="row-head"><span>Chrome render</span><span class="ok" id="ok3">OK</span></div>
                <div class="track"><div class="fill" id="f3"></div></div>
              </div>
            </div>
          </div>

          <div class="bottombar" id="bottombar">
            <span>Hyperframes · 30 fps</span>
            <span class="tc" id="tc">00.0 / 15.0</span>
          </div>
        </div>

        <div class="stamp" id="stamp">
          <div class="stamp-box" id="stampBox">
            <div class="stamp-text">Todo funciona</div>
            <div class="stamp-sub">3 de 3 revisiones superadas</div>
          </div>
        </div>

        <div class="veil" id="veil"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Ambient background: slow drift and breathing glow across the whole piece
      tl.fromTo("#ghost", { x: 0 }, { x: -520, duration: 15, ease: "none" }, 0);
      tl.fromTo(
        "#glow",
        { scale: 0.9, opacity: 0.75 },
        { scale: 1.08, opacity: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 4 },
        0,
      );

      // Timecode readout
      const clock = { t: 0 };
      const tc = document.getElementById("tc");
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: 15,
          duration: 15,
          ease: "none",
          onUpdate: () => {
            tc.textContent = clock.t.toFixed(1).padStart(4, "0") + " / 15.0";
          },
        },
        0,
      );

      // Open: top bar and rule
      tl.fromTo("#veil", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.2);
      tl.fromTo("#topbar", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.fromTo("#bottombar", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);

      // Headline slams: distinct entrance per word
      tl.fromTo(
        "#w1",
        { opacity: 0, scale: 1.4, transformOrigin: "left center" },
        { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" },
        0.8,
      );
      tl.fromTo(
        "#w2",
        { opacity: 0, x: -120 },
        { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.6)" },
        1.3,
      );
      tl.fromTo("#sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.0);

      // Checklist panel and progress fills
      tl.fromTo("#panel", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 3.0);
      [
        ["#r1", "#f1", "#ok1", 3.6],
        ["#r2", "#f2", "#ok2", 5.0],
        ["#r3", "#f3", "#ok3", 6.4],
      ].forEach(([row, fill, ok, at]) => {
        tl.fromTo(row, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at);
        tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, at + 0.2);
        tl.fromTo(ok, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 1.2);
      });

      // Closing stamp: clear the stage first so the stamp owns the frame
      tl.fromTo("#mainContent", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in", immediateRender: false }, 9.0);
      tl.fromTo("#stamp", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 9.6);
      tl.fromTo(
        "#stampBox",
        { scale: 1.25, rotation: -4 },
        { scale: 1, rotation: -2, duration: 0.5, ease: "expo.out" },
        9.6,
      );
      tl.fromTo("#stampBox", { y: 0 }, { y: -20, duration: 3.6, ease: "sine.inOut", immediateRender: false }, 10.1);

      // Outro fade
      tl.fromTo("#veil", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.in", immediateRender: false }, 14.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
